name: simulator-dev

services:
  # The frontend dev container is defined in .devcontainer/docker-compose.yml.

  database:
    build:
      context: ../database
      dockerfile: ../simulator-workspace/database.Containerfile
    init: true
    environment:
      HOST: ${HOST}
      PORT: ${PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL}
      FIREBASE_SERVICE_ACCOUNT_KEY_FILE: ${FIREBASE_SERVICE_ACCOUNT_KEY_FILE}
      GOOGLE_STORAGE_SERVICE_ACCOUNT_KEY_FILE: ${GOOGLE_STORAGE_SERVICE_ACCOUNT_KEY_FILE}
      GOOGLE_STORAGE_BUCKET_NAME: ${GOOGLE_STORAGE_BUCKET_NAME}
      GOOGLE_STORAGE_PROJECT_ID: ${GOOGLE_STORAGE_PROJECT_ID}
      LEASE_KEY: ${LEASE_KEY:-}
      ADMIN_PUBLIC_KEY: ${ADMIN_PUBLIC_KEY:-}
    secrets:
      - service_account_key
    depends_on:
      redis:
        condition: service_started
    ports:
      - "4000:4000"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

volumes:
  redis-data:

secrets:
  service_account_key:
    file: ${SERVICE_ACCOUNT_KEY_HOST_FILE:-./service_account_key.json}
